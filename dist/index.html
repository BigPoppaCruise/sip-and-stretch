pinalTwist.png",catCow:"poses/catCow.png",happyBaby:"poses/happyBaby.png",savasana:"poses/savasana.png"},Dr={blocks:[{id:"welcome",label:"Welcome",color:"#c9a96e",stretches:[{id:1,name:"Arrive & Breathe",duration:300,pose:"breathwork",bilateral:!1,instruction:"Lie on your back, knees bent, feet flat. Inhale 4 counts through your nose, hold 2, exhale slowly for 6 through your mouth.",muscleInfo:"Activates the parasympathetic nervous system — shifts your body out of fight-or-flight and into recovery mode.",standard:{label:"Supine Breathwork",description:"Back flat on mat, knees bent, feet hip-width. Arms at sides, palms up. Eyes closed."},modified:null}]},{id:"supine",label:"Supine",color:"#b87d5e",stretches:[{id:2,name:"Figure Four",duration:90,pose:"figureFour",bilateral:!0,instruction:"Cross one ankle over the opposite knee. Flex the top foot. Gently draw both legs toward your chest.",muscleInfo:"Piriformis and glute medius — the stabilizers behind every step on the treadmill.",standard:{label:"Supine Figure Four",description:"Lying on back — cross ankle over quad above the knee. Interlace hands behind bottom thigh and draw toward chest."},modified:{label:"Wall-Supported",description:"Press bottom foot flat against wall with knee at 90°. Cross ankle over quad and let gravity do the work."}},{id:3,name:"Knee to Chest",duration:90,pose:"supineHipFlex",bilateral:!0,instruction:"Lying on your back — extend one leg long on the mat. Draw the opposite knee gently into your chest.",muscleInfo:"Psoas — runs from your lower spine to your femur and shortens with every run and every hour of sitting.",standard:{label:"Knee to Chest",description:"Lie flat. Extend one leg long, press the back of that knee toward the floor. Pull opposite knee to chest."},modified:{label:"Towel Under Knee",description:"Place a folded towel under the extended knee for lower back support. Slightly bend the extended leg if needed."}},{id:7,name:"Supine Hamstring Stretch",duration:90,pose:"legRaise",bilateral:!0,instruction:"Lie on your back. Extend one leg toward the ceiling. Hold behind the thigh or calf. Flex the foot — toes toward your shin.",muscleInfo:"Flexing the foot adds the calf — you're stretching the entire posterior line of the leg in one hold.",standard:{label:"Leg Raise Hold",description:"One leg flat, one raised. Hold behind calf or thigh. Flex foot, toes toward shin. Both hips grounded."},modified:{label:"Strap or Towel",description:"Loop a belt or towel around the arch of the lifted foot. Hold both ends — removes flexibility requirement."}},{id:15,name:"Supine Spinal Twist",duration:90,pose:"spinalTwist",bilateral:!0,instruction:"Lying on your back, draw one knee to your chest and guide it across your body. Arm out at shoulder height. Gaze opposite.",muscleInfo:"Paraspinal muscles along the spine — compressed during every forward-hinge movement in OTF floor work.",standard:{label:"Full Twist",description:"Knee crosses body, shoulder stays grounded. Opposite hand gently on crossed knee. Hold completely still."},modified:{label:"Bolstered Knee",description:"Pillow under the crossed knee so it doesn't hang. Reduces rotation intensity for those with lower back sensitivity."}},{id:17,name:"Neck Release",duration:90,pose:"neckRelease",bilateral:!0,instruction:"Lying on your back, let your head rest heavy on the mat. Slowly tilt one ear toward that shoulder until you feel a soft stretch up the side of the neck. Keep the opposite shoulder anchored down and breathe.",muscleInfo:"Upper trapezius and levator scapulae — the neck and shoulder tension that stacks up from rowing posture, treadmill gripping, and long hours hunched at a desk.",standard:{label:"Supported Ear to Shoulder",description:"Ear drifts toward the shoulder, opposite shoulder relaxing down and away. Rest the same-side hand lightly on your head for a touch more weight — never pull. Turn the nose slightly down to find the levator."},modified:{label:"Seated & Anchored",description:"Sit tall in a chair or cross-legged. Tuck the opposite hand under your thigh to keep that shoulder down, then tilt the ear toward your shoulder. Easier to control how deep you go."}}]},{id:"floor",label:"Floor/Kneeling",color:"#7d9b8a",stretches:[{id:20,name:"Lying Quad Stretch",duration:120,pose:"lyingQuad",bilateral:!0,instruction:"Sit with one leg long and the other folded back beside your hip. Lean into your hands and lift your chest. Keep the bent knee comfortable and stay tall through the front of the thigh.",muscleInfo:"Quad and front hip - this opens the tissue that shortens with every treadmill stride, squat, and long stretch of sitting.",standard:{label:"Lean-Back Quad Stretch",description:"One leg extends forward, the other folds back beside the hip. Hands on floor behind you, chest lifted, both sit bones grounded as much as possible."},modified:{label:"More Upright",description:"Sit higher on a folded blanket or yoga block and keep more weight in your hands. If the knee is sensitive, reduce the bend or come out immediately."}},{id:16,name:"Cat-Cow",duration:90,pose:"catCow",bilateral:!1,instruction:"On all fours. Full exhale on the round, full inhale on the open. If somewhere feels amazing — stay there.",muscleInfo:"Decompresses the lumbar discs and rehydrates spinal cartilage. This is deliberate, slow restoration — not warm-up.",standard:{label:"Breath-Led Flow",description:"Hands under shoulders, knees under hips. Exhale: round spine up. Inhale: drop belly, lift chest. 4–6 slow rounds."},modified:{label:"Seated Chair Version",description:"Sit at edge of chair, hands on knees. Same motion — no floor required. Great for wrist sensitivity."}},{id:22,name:"Cobra",duration:60,pose:"cobra",bilateral:!1,instruction:"Lie on your belly with your palms under your shoulders. Press lightly into your hands, lift your chest, and keep the back of your neck long.",muscleInfo:"Abdominals and front body - this gives the chest, hip flexors, and trunk a gentle extension after all the rounding and hinging.",standard:{label:"Low Cobra",description:"Legs long behind you, tops of feet pressing down. Lift the chest with light hand support and shoulders sliding away from ears."},modified:{label:"Baby Cobra",description:"Keep more weight in the floor and lift only a little. You can also place forearms down for a sphinx-like version if the low back wants less."}},{id:11,name:"Childs Pose",duration:90,pose:"childsPose",bilateral:!1,instruction:"Wide knees, sit hips toward heels. Walk hands forward.",muscleInfo:"Lat — the largest back muscle, connecting your arm to your spine. Compressed during every rowing stroke.",standard:{label:"Extended Child's Pose",description:"Knees wide, big toes together. Walk hands far forward. For lat: shift hands to one side, press opposite hip back."},modified:{label:"Supported with Bolster",description:"Place a pillow under chest or forehead. Reduces compression for those with knee sensitivity."}},{id:10,name:"Thread the Needle",duration:90,pose:"threadNeedle",bilateral:!0,instruction:"On all fours, slide one arm palm-up under your body until the shoulder and ear rest on the mat.",muscleInfo:"Thoracic spine and posterior shoulder — the exact area that locks up from rowing posture.",standard:{label:"Full Thread",description:"Slide arm under body, shoulder and ear on mat. Opposite hand reaches overhead. Hips stay level."},modified:{label:"Seated Rotation",description:"Sit cross-legged. One hand behind you on floor, other on opposite knee. Rotate gently, looking over shoulder."}},{id:4,name:"Low Lunge",duration:90,pose:"lowLunge",bilateral:!0,instruction:"Step one foot forward into a lunge. Drop the back knee to the mat. Press hips gently forward and down.",muscleInfo:"Deep hip flexor and quad — reverses the shortening pattern that builds up from every stride on the tread.",standard:{label:"Kneeling Lunge",description:"Front knee over ankle, back knee on mat. Hands on front knee, chest tall. Option: arms overhead to deepen."},modified:{label:"Hands on Floor",description:"Both hands on the floor on either side of front foot for support. Only lower as far as comfortable."}},{id:5,name:"Pigeon Pose",duration:90,pose:"pigeon",bilateral:!0,instruction:"From a lunge, bring your front shin across the mat. Sink hips toward the floor. Fold your chest forward.",muscleInfo:"Piriformis and deep glute — the deepest hip external rotator stretch available. Chronically loaded from rowing and running.",standard:{label:"Full Pigeon",description:"Front shin angled or parallel to mat. Back leg extends behind. Fold chest over front shin onto forearms or forehead."},modified:{label:"Reclined Figure Four",description:"Stay on your back in figure four position — identical hip stretch with zero pressure on the knee."}}]},{id:"break",label:"Break",color:"#c9a96e",stretches:[{id:9,name:"Top Off Your Glass",duration:180,pose:"sipBreak",bilateral:!1,instruction:"Stand, move naturally, sip, breathe. A few gentle hip circles or shoulder rolls if it feels good.",muscleInfo:"Intentional rest is part of recovery. The nervous system integrates work during stillness — not just during movement.",standard:{label:"Rest & Reset",description:"Move naturally. Hydrate. Enjoy. You're halfway through."},modified:null}]},{id:"break2",label:"Break",color:"#c9a96e",stretches:[{id:23,name:"Sip Break — Round Two",duration:180,pose:"sipBreak",bilateral:!1,instruction:"Stand, move naturally, sip, breathe. A few gentle hip circles or shoulder rolls if it feels good.",muscleInfo:"Intentional rest is part of recovery. The nervous system integrates work during stillness — not just during movement.",standard:{label:"Rest & Reset",description:"Move naturally. Hydrate. Enjoy. The home stretch is ahead."},modified:null}]},{id:"standing",label:"Standing",color:"#8a7db8",stretches:[{id:13,name:"Cross-Body Shoulder",duration:60,pose:"crossBody",bilateral:!0,instruction:"Pull one arm across your chest. Press just above the elbow — not on the joint — with your other hand. Then overhead tricep.",muscleInfo:"Posterior shoulder and rotator cuff — the most loaded and most neglected structure in OTF training.",standard:{label:"Cross-Body Hold",description:"Arm across chest, opposite hand pressing above elbow. Hold, then bend elbow behind head for overhead tricep."},modified:null},{id:12,name:"Chest Opener",duration:90,pose:"chestOpener",bilateral:!1,instruction:"Interlace your fingers behind your back. Squeeze your shoulder blades together, straighten your arms, and open your chest toward the ceiling.",muscleInfo:"Pec major and anterior shoulder — rowing and every pressing movement pulls them forward. This reverses it.",standard:{label:"Clasped Hands Chest Opener",description:"Stand tall, fingers interlaced behind back, arms straight. Lift hands slightly away from body and open chest upward."},modified:{label:"Hands Clasped Behind",description:"Clasp hands behind your back and open chest to ceiling — a deeply effective alternative with no wall needed."}},{id:8,name:"Calf & Achilles Stretch",duration:60,pose:"calfStretch",bilateral:!0,instruction:"Step one foot back about two feet. Press your back heel firmly into the floor. Slight bend in the front knee. Hands rest on your front thigh for balance.",muscleInfo:"Gastrocnemius and soleus — loaded on every treadmill step. No wall needed.",standard:{label:"Split Stance Heel Press",description:"Back heel flat on floor, front knee soft. Hold still — don't bounce. Switch sides when prompted."},modified:null}]},{id:"seated",label:"Seated",color:"#6b9bb8",stretches:[{id:21,name:"Side Bend",duration:90,pose:"sideBend",bilateral:!0,instruction:"Sit tall with one hand grounded beside you. Reach the other arm overhead and arc gently to the side. Keep both sit bones heavy and breathe into the open ribs.",muscleInfo:"Lats and obliques - this opens the side body that tightens with rowing, running arm drive, and long hours at a desk.",standard:{label:"Seated Side Reach",description:"One hand or fingertips on the floor, opposite arm arcs overhead. Keep chest open instead of collapsing forward."},modified:{label:"Prop Under Hips",description:"Sit on a folded blanket or block to reduce low back strain. Keep the bend smaller and support the lower hand on a yoga block if needed."}},{id:6,name:"Seated Forward Fold",duration:120,pose:"seatedFold",bilateral:!1,instruction:"Sit tall with legs extended. Inhale to lengthen the spine, then exhale and hinge forward from your hips. Let your hands land where they land.",muscleInfo:"Hamstrings, calves, and lower back — the entire posterior chain that takes the most load during rowing and floor work.",standard:{label:"Full Forward Fold",description:"Legs straight, feet flexed. Hinge from hips with a flat back. Reach toward feet wherever they land."},modified:{label:"Bent Knees",description:"Bend your knees significantly to remove strain from the lower back. Gradually work toward straightening over time."}},{id:14,name:"Butterfly Stretch",duration:90,pose:"butterfly",bilateral:!1,instruction:"Sit tall and bring the soles of your feet together, letting your knees fall open to the sides. Hold your ankles, lengthen your spine, then gently fold forward from the hips.",muscleInfo:"Adductors and inner hips — the deep groin tissue that gets locked from the rowing stroke, squats, and long stretches of sitting.",standard:{label:"Baddha Konasana",description:"Soles of the feet together, heels drawn in toward the body. Sit tall, let the knees release toward the floor, and optionally fold forward from the hips."},modified:{label:"Elevated & Supported",description:"Sit up on a folded blanket and slide the feet further forward to ease the groin. Rest cushions or blocks under the knees so they have something to lean into."}}]},{id:"closing",label:"Closing",color:"#c9a96e",stretches:[{id:18,name:"Savasana",duration:300,pose:"savasana",bilateral:!1,instruction:"Legs extended, palms facing up, arms slightly away from your body. Close your eyes. There is nothing left to do.",muscleInfo:"The nervous system consolidates the benefits of stretching during complete stillness. This is the most important five minutes.",standard:{label:"Full Rest",description:"Completely flat. Legs relaxed and falling open naturally. Arms slightly away from body, palms up. Eyes closed."},modified:null}]}]},oy=["welcome","supine","break","floor","break2","standing","seated","closing"];oy.map(E=>Dr.blocks.find(Z=>Z.id===E)).filter(Boolean);const sy=Object.fromEntries(Dr.blocks.flatMap(E=>E.stretches.map(Z=>[Z.id,{...Z,blockId:E.id,blockColor:E.color,blockLabel:E.label}]))),dy=sy,ry=[1,2,3,7,15,17,9,20,16,22,11,10,4,5,23,13,12,8,21,14,6,18],Te=ry.map(E=>dy[E]).filter(Boolean),rc="#8879d8";function hy(E){const Z=Math.floor(E/60),q=E%60;return Z>0?`${Z}:${q.toString().padStart(2,"0")}`:`${q}`}function yy({poseKey:E,isModified:Z}){const[q,h]=Pl.useState(!1),x=cy[E],ul=x?.endsWith(".png")?"none":Z?"brightness(0) invert(1) opacity(0.55) sepia(1) hue-rotate(190deg) saturate(2.5)":"brightness(0) invert(1) opacity(0.88)";return!x||q?N.jsx("div",{style:{width:"100%",height:"100%",maxHeight:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"52px",opacity:.3},children:"🧘"}):N.jsx("img",{src:x,alt:E,onError:()=>h(!0),style:{width:"auto",height:"auto",maxWidth:"100%",maxHeight:"100%",filter:ul,opacity:.6,animation:"breathe 12s ease infinite",padding:"0",display:"block",borderRadius:"35px"}})}function my({elapsed:E,total:Z,color:q,size:h=96}){const x=h/2,Y=x-6,ul=2*Math.PI*Y,rl=ul*Math.min(1,E/Z),D=Math.max(0,Z-E);return N.jsxs("div",{style:{position:"relative",width:h,height:h,flexShrink:0},children:[N.jsxs("svg",{width:h,height:h,style:{transform:"rotate(-90deg)"},children:[N.jsx("circle",{cx:x,cy:x,r:Y,fill:"none",stroke:"rgba(255,255,255,0.07)",strokeWidth:"6"}),N.jsx("circle",{cx:x,cy:x,r:Y,fill:"none",stroke:q,strokeWidth:"6",strokeDasharray:ul,strokeDashoffset:rl,strokeLinecap:"round",style:{transit

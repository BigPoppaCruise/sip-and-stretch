  <!-- LEFT shin back to feet -->
  <path d="M420 450 Q472 470 548 474 L584 474 L580 496 Q484 496 428 480 Q402 472 404 454 Z" fill="#241c49"/>
  <!-- RIGHT shin back to feet -->
  <path d="M780 450 Q728 470 652 474 L616 474 L620 496 Q716 496 772 480 Q798 472 796 454 Z" fill="#241c49"/>
  <!-- FEET: soles together at center, prominent -->
  <path d="M578 442 Q552 438 542 452 Q534 466 546 480 Q558 492 584 490 L596 486 L596 446 Z" fill="#9d8bd8"/>
  <path d="M622 442 Q648 438 658 452 Q666 466 654 480 Q642 492 616 490 L604 486 L604 446 Z" fill="#b9a6e8"/>
  <path d="M600 444 L600 488" stroke="#6f5cb3" stroke-width="3.5" stroke-linecap="round"/>

  <!-- TORSO: shorter, top to hips -->
  <path d="M600 234 Q656 238 672 266 Q686 294 680 336 Q674 376 652 394 Q628 408 600 408 Q572 408 548 394 Q526 376 520 336 Q514 294 528 266 Q544 238 600 234 Z" fill="#2c2450"/>
  <path d="M564 244 Q600 256 636 244 L630 274 Q600 284 570 274 Z" fill="#f06a93" opacity="0.35"/>

  <!-- ARMS: down and inward, hands on the feet -->
  <path d="M540 262 Q516 300 512 348 Q509 396 538 432 Q552 448 572 454 L582 434 Q564 426 552 402 Q540 374 544 338 Q548 298 560 268 Z" fill="url(#skin)"/>
  <path d="M660 262 Q684 300 688 348 Q691 396 662 432 Q648 448 628 454 L618 434 Q636 426 648 402 Q660 374 656 338 Q652 298 640 268 Z" fill="url(#skin)"/>
  <ellipse cx="574" cy="452" rx="16" ry="12" fill="url(#skin)"/>
  <ellipse cx="626" cy="452" rx="16" ry="12" fill="url(#skin)"/>

  <!-- HEAD -->
  <g>
    <circle cx="600" cy="176" r="43" fill="url(#skin)"/>
    <path d="M600 129 Q651 131 659 180 Q661 199 653 213 Q649 182 632 165 Q616 151 600 151 Q584 151 568 165 Q551 182 547 213 Q539 199 541 180 Q549 131 600 129 Z" fill="#1d1535"/>
    <circle cx="600" cy="123" r="16" fill="#1d1535"/>
    <path d="M577 181 Q584 186 591 181" stroke="#b25a4e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M609 181 Q616 186 623 181" stroke="#b25a4e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M592 203 Q600 208 608 203" stroke="#c96a5e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M583 215 L617 215 L615 238 Q600 244 585 238 Z" fill="url(#skin)"/>

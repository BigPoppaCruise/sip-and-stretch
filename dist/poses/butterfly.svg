<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="matTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b6cc0"/>
      <stop offset="1" stop-color="#5d5099"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9b899"/>
      <stop offset="1" stop-color="#ef7f92"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8d7cd6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8d7cd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="#251d45"/>
  <ellipse cx="600" cy="330" rx="480" ry="260" fill="url(#glow)"/>

  <!-- mat -->
  <path d="M250 470 L950 470 Q985 470 978 490 L966 534 Q962 550 926 550 L272 550 Q236 550 242 530 L252 490 Q258 470 286 470 Z" fill="#4a3f85"/>
  <path d="M250 470 L950 470 Q985 470 979 488 L972 508 Q968 520 936 520 L262 520 Q228 520 234 502 L242 488 Q247 470 276 470 Z" fill="url(#matTop)"/>

  <!-- shadow -->
  <ellipse cx="600" cy="480" rx="235" ry="15" fill="#2e2660" filter="url(#soft)"/>

  <!-- ===== FIGURE: seated butterfly, frontal — big open diamond ===== -->

  <!-- LEFT thigh out to knee -->

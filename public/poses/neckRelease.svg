<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="matTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b6cc0"/>
      <stop offset="1" stop-color="#5d5099"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9b899"/>
      <stop offset="1" stop-color="#ef7f92"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8d7cd6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8d7cd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="#251d45"/>
  <ellipse cx="600" cy="330" rx="480" ry="260" fill="url(#glow)"/>

  <!-- mat -->
  <path d="M270 468 L930 468 Q965 468 958 488 L946 532 Q942 548 906 548 L292 548 Q256 548 262 528 L272 488 Q278 468 306 468 Z" fill="#4a3f85"/>
  <path d="M270 468 L930 468 Q965 468 959 486 L952 506 Q948 518 916 518 L282 518 Q248 518 254 500 L262 486 Q267 468 296 468 Z" fill="url(#matTop)"/>

  <!-- shadow -->
  <ellipse cx="600" cy="480" rx="250" ry="24" fill="#2e2660" filter="url(#soft)"/>

  <!-- ===== FIGURE: seated neck release, frontal, head tilted to the right ===== -->

  <!-- cross-legged base -->
  <path d="M600 396 Q708 396 756 432 Q788 456 776 474 Q764 490 700 490 L500 490 Q436 490 424 474 Q412 456 444 432 Q492 396 600 396 Z" fill="#2c2450"/>
  <path d="M470 452 Q520 434 580 452 Q600 460 592 474 Q560 486 510 480 Q468 474 464 462 Z" fill="#241c49"/>
  <path d="M730 452 Q680 434 620 452 Q600 460 608 474 Q640 486 690 480 Q732 474 736 462 Z" fill="#241c49"/>
  <!-- foot peeking at center front -->
  <path d="M588 462 Q568 456 556 464 Q546 472 554 482 Q564 490 588 488 L612 484 Q616 472 606 466 Z" fill="#b9a6e8"/>

  <!-- torso (top covers to hips) -->
  <path d="M600 232 Q662 236 678 266 Q692 296 686 344 Q680 392 656 410 Q630 424 600 424 Q570 424 544 410 Q520 392 514 344 Q508 296 522 266 Q538 236 600 232 Z" fill="#2c2450"/>
  <path d="M560 244 Q600 256 640 244 L632 280 Q600 290 568 280 Z" fill="#f06a93" opacity="0.35"/>

  <!-- LEFT arm anchored down, hand tucked by hip -->
  <path d="M532 262 Q510 300 504 348 Q498 394 506 428 L532 434 Q526 396 528 352 Q532 306 548 270 Z" fill="url(#skin)"/>
  <ellipse cx="518" cy="436" rx="17" ry="12" fill="url(#skin)"/>

  <!-- HEAD tilted toward screen-right shoulder -->
  <g transform="rotate(16 600 222)">
    <circle cx="600" cy="170" r="44" fill="url(#skin)"/>
    <!-- hair -->
    <path d="M600 122 Q652 124 660 174 Q662 194 654 208 Q650 176 632 158 Q616 144 600 144 Q584 144 568 158 Q550 176 546 208 Q538 194 540 174 Q548 124 600 122 Z" fill="#1d1535"/>
    <circle cx="600" cy="116" r="17" fill="#1d1535"/>
    <!-- closed eyes -->
    <path d="M576 174 Q583 179 590 174" stroke="#b25a4e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M610 174 Q617 179 624 174" stroke="#b25a4e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M592 196 Q600 200 608 196" stroke="#c96a5e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- neck -->
    <path d="M580 208 L620 208 L618 236 Q600 242 582 236 Z" fill="url(#skin)"/>
  </g>

  <!-- RIGHT arm: up and over, hand resting gently on far side of head -->
  <path d="M662 268 Q688 242 694 204 Q698 170 678 146 Q658 124 624 118 L620 140 Q648 146 662 164 Q674 180 670 208 Q664 240 644 260 Z" fill="url(#skin)"/>
  <!-- hand resting on the head's upper-left -->
  <ellipse cx="614" cy="126" rx="19" ry="13" transform="rotate(26 614 126)" fill="url(#skin)"/>
</svg>
